const liftSpan = v => v==null||isNaN(v) ? '<span class="muted">—</span>' :
  (v>=0?'<span class="pos">+'+v.toFixed(1)+'%</span>':'<span class="neg">'+v.toFixed(1)+'%</span>');
const CAT_CLS = {'品类内(厨房相关)':'pill pill-cat','跨品类场景(食品生鲜等)':'pill pill-scene','泛人群(家用电器)':'pill pill-fan','未命中基准':'pill pill-unh'};
const catPill = c => '<span class="'+(CAT_CLS[c]||'pill pill-unh')+'">'+c.replace(/\(.*\)/,'')+'</span>';
function barCell(v, max, isNeg, f){ f = f||(x=>fmt(x)); const p = max>0? Math.min(Math.abs(v)/max*100,100):0;
  return '<td class="bar-cell"><div class="bar-bg'+(isNeg?' neg':'')+'" style="width:'+p+'%"></div><span class="bar-txt">'+f(v)+'</span></td>'; }
function div(html, id){ const e=document.createElement('div'); e.innerHTML=html; document.getElementById('main').appendChild(e.firstChild); return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
</script>

        formatter:p=>labels[p.dataIndex]}}

})();

<script>
/* ========== 以价换量评估（ROI折损 ↔ 消耗提升） ========== */
(function(){
  const T=D.tradeoff, h=D.overview.hit_agg, u=D.overview.unh_agg;
  let html=`<section>
    <h2><span class="tag">换算</span>「以价换量」评估：ROI 折损 ↔ 消耗提升</h2>
    <div class="concl"><b>结论：以人群层 ${fmt(-T.roi_loss,1)}% 的 ROI 折损（${fmt(T.hit_roi)} vs ${fmt(T.unh_roi)}），换来 ${fmt(T.cost_share,1)}% 的消耗提升（增量消耗 ${fw(T.hit_cost)}）——弹性约 1 : ${fmt(T.elastic_cost,2)}</b>：每 1% ROI 折损约换 0.68% 消耗增量，反过来每提升 1% 消耗需付约 1.5% ROI 折损。<br/>
    放到整体盘面：<b>总消耗 +${fmt(T.cost_share,1)}% 的代价，是整体 ROI 从 ${fmt(T.tot_roi_stop)} 降至 ${fmt(T.tot_roi_cur)}（${fmt(T.tot_roi_lift,1)}%）</b>；边际上每多投 1 万元在场景人群，下单金额比投未命中渠道少 ${fmt(Math.abs(T.marginal_cost_per_wan),0)} 元。<br/>
    且这并非"加价买量"：命中人群目标出价加权 ¥${fmt(T.bid_hit_wavg,1)}（最高 ¥${fmt(T.bid_hit_max,1)}）<b>低于</b>未命中流量 ¥${fmt(T.bid_unh,1)}，CPC 还低 ${fmt((1-h.cpc/u.cpc)*100,1)}%——场景人群竞争少、转化好，<b>低价即可拿到增量消耗</b>。</div>
    <div class="grid2">
      <div><table><thead><tr><th>换算口径</th><th>数值</th></tr></thead><tbody>
        <tr><td>ROI 折损（命中 vs 未命中）</td><td><span class="neg">${fmt(T.roi_loss,1)}%</span></td></tr>
        <tr><td>消耗提升（增量消耗 ${fw(T.hit_cost)}）</td><td><span class="pos">+${fmt(T.cost_share,1)}%</span></td></tr>
        <tr><td>换算弹性</td><td>每 1% ROI 折损 → <span class="pos">${fmt(T.elastic_cost,2)}%</span> 消耗提升</td></tr>
        <tr><td>反向弹性</td><td>每 1% 消耗提升 → <span class="neg">${fmt(T.elastic_roi,2)}%</span> ROI 折损</td></tr>
        <tr><td>整体盘面（总消耗 +${fmt(T.cost_share,1)}%）</td><td>整体 ROI ${fmt(T.tot_roi_stop)} → ${fmt(T.tot_roi_cur)}（${fmt(T.tot_roi_lift,1)}%）</td></tr>
        <tr><td>边际代价（每万元增量消耗）</td><td>下单金额少 ${fmt(Math.abs(T.marginal_cost_per_wan),0)} 元</td></tr>
        <tr><td>目标出价（加权）</td><td>¥${fmt(T.bid_hit_wavg,1)} vs ¥${fmt(T.bid_unh,1)}（${fmt((T.bid_hit_wavg/T.bid_unh-1)*100,1)}%）</td></tr>
      </tbody></table>
      <div class="note">「消耗提升」= 分人群出价带来的增量消耗，上限假设为停用后消耗全部流失（占总量 ${fmt(T.cost_share,1)}%）；实际增量取决于停用后消耗的保留率，见右表。</div></div>
      <div><table><thead><tr><th>停用后消耗保留率</th><th>实际增量消耗</th><th>占总盘</th><th>停用后总下单金额</th><th>启用 vs 停用</th></tr></thead><tbody>`;
  for(const r of T.sens){
    const pos=r.delta>=0;
    html+='<tr><td>'+r.s.toFixed(1)+'%</td><td>'+fw(r.incr_cost)+'</td><td>'+r.incr_share.toFixed(2)+'%</td><td>'+fw(r.stop_amt)+'</td><td>'+
      (pos?'<span class="pos">启用多 '+fw(r.delta)+'</span>':'<span class="neg">停用多 '+fw(-r.delta)+'</span>')+'</td></tr>';
  }
  html+=`</tbody></table>
      <div class="note"><b>盈亏平衡点：保留率 ${fmt(T.s_star,1)}%。</b>只要停用分人群出价会让这部分消耗流失超过 ${fmt(100-T.s_star,1)}%，启用就是净划算的——场景化人群触达的是品类外新流量，停用后难以回流原投放，保留率大概率低于平衡点。<b>最保守口径（消耗 100% 保留、ROI 折损全额承受）下，代价也仅占总盘下单金额 ${fmt(-T.sens[T.sens.length-1].delta_pct,2)}%。</b></div></div>
    </div></section>`;
  div(html);
})();

  const maxCost=Math.max(...tags.map(t=>t.cost));
  let html=`<section>
    <h2><span class="tag">证据四</span>19个leveltag人群排行：谁好谁差、共性是什么</h2>
    <div class="concl"><b>共性结论：ROI 好的人群 = 「高频刚需食材」人群（蛋类 2.70 / 蔬菜干 2.71 / 蟹类 2.70 / 调味料 2.62 / 鸡肉 2.60）；ROI 差的人群集中在「泛词人群」——品类内的厨房工具（1.68）、泛蔬菜山药（1.86）、鱼类（1.97）。</b>
    判断逻辑：高频购买生鲜食材的用户与厨房用具的使用场景强绑定、且购买决策路径短；而泛工具词/泛食材词人群点击便宜但转化链路长。注意品类内并非都好、跨品类并非都差，<b>人群价值取决于「场景使用频率 × 决策门槛」，而非品类是否在行业内部</b>。<br/>
    从 CTR×CVR × ROI 矩阵看：<b>曝光下单效率（CTR×CVR）与 ROI 大体正相关</b>——厨房工具（0.082%）、山药（0.090%）、烧烤烘焙（0.050%）效率与 ROI 双低；但<b>效率最高 ≠ ROI 最高</b>：厨房小电曝光下单效率最高（0.157%）ROI 仅 2.23，因客单价最低（¥111）；而蟹类效率仅 0.072% 却凭最高客单价（¥143）拿到 ROI 2.70。选人群需按目标分层：跑量选厨房小电/鸡肉，跑 ROI 选蛋类/蔬菜干/蟹类。</div>
    <div class="grid2"><div><div class="chart" id="chartTags"></div></div>
    <div style="min-width:480px"><div class="scrollbox"><table><thead><tr><th>人群</th><th>组</th><th>消耗</th><th>CTR</th><th>CPC</th><th>下单cvr</th><th>CTR×CVR</th><th>ROI</th><th>ROI vs<br>未命中</th></tr></thead><tbody>`;
  for(const t of tags){
    const small=t.cost<1000;
    const rl=(t.roi/unh.roi-1)*100;
    html+='<tr'+(small?' class="gray-row"':'')+'><td>'+esc(t.name)+'</td><td>'+catPill(t.cat)+'</td>'+
      barCell(t.cost,maxCost)+(small?'':'')+'<td>'+fmt(t.ctr)+'</td><td>'+fmt(t.cpc)+'</td><td>'+fmt(t.order_cvr)+'</td><td>'+fmt(t.ctr*t.order_cvr/100)+'</td><td>'+fmt(t.roi)+'</td><td>'+liftSpan(rl)+'</td></tr>';
  }
  html+='</tbody></table></div><div class="note">灰色行消耗 &lt;1000 元（小样本，仅参考）。海鲜/水产存在两个同义人群ID（52_2302766 与 52_2302767 前缀），已分别独立统计。</div></div></div></section>';
  div(html);
  /* 散点：CTR vs ROI，气泡=消耗 */
  const cmap={'品类内(厨房相关)':'#3E79F0','跨品类场景(食品生鲜等)':'#FFAE19','泛人群(家用电器)':'#8E84FD'};
  const show=tags.filter(t=>t.cost>=800);
  const ec=echarts.init(document.getElementById('chartTags'));
  ec.setOption({
    title:{text:'人群矩阵：CTR×CVR × ROI（气泡=消耗，仅展示消耗≥800元人群）',left:'center',textStyle:{fontSize:14}},
    tooltip:{formatter:p=>p.data[3]+'<br/>'+p.seriesName+'<br/>CTR '+p.data[4].toFixed(2)+'% × 下单CVR '+p.data[5].toFixed(2)+'% = '+(p.data[0]).toFixed(2)+'%<br/>ROI '+p.data[1].toFixed(2)+' · 消耗 '+(p.data[2]/10000).toFixed(2)+'万'},
    legend:{top:30,data:Object.keys(cmap)},
    grid:{left:70,right:40,bottom:60,top:70},
    xAxis:{name:'CTR×CVR（曝光下单率%）',nameLocation:'middle',nameGap:32,type:'value',scale:true},
    yAxis:{name:'下单ROI',nameLocation:'middle',nameGap:42,type:'value',scale:true,min:1.5},
    series:Object.keys(cmap).map(g=>({
      name:g,type:'scatter',
      data:show.filter(t=>t.cat===g).map(t=>[t.ctr*t.order_cvr/100,t.roi,t.cost,t.name,t.ctr,t.order_cvr]),
      symbolSize:d=>Math.sqrt(d[2])/2.4,
      itemStyle:{color:cmap[g],opacity:.8},
      label:{show:true,position:'top',formatter:p=>p.data[3].split('_').slice(-1)[0],fontSize:11,color:'#47566E'}
    })),
    markLine:{}
  });
})();
</script>
<script>
/* ========== 证据五：分客户 × 人群明细 ========== */
(function(){
  const custs=[...new Set(D.detail.map(d=>d.customer))].sort((a,b)=>{
    const ca=D.per_cust.find(x=>x.customer===a), cb=D.per_cust.find(x=>x.customer===b);
    return (cb?cb.hit_cost:0)-(ca?ca.hit_cost:0);});
  const maxCost=Math.max(...D.detail.map(d=>d.cost));
  let html=`<section>
    <h2><span class="tag">证据五</span>分客户 × 分人群明细矩阵
      <span style="margin-left:12px"><select id="custSel"><option value="ALL">全部客户</option>
      ${custs.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')}</select></span>
    </h2>
    <div class="concl">客户层面共性：<b>8家客户命中ROI相对各自未命中流量全部为负</b>（-0.2% ~ -25.8%），但归因不同——创大厨具（规模最大，命中2.34万）是「CTR +16.6%、CPC -7.6% 但下单转化 -27.0%」，属人群点击强、商品承接弱；杭州厨艺宝库下单转化 +86.1% 且 ROI 几乎持平（-0.6%）、芭荷 ROI -0.2%，是目前<b>跑通人群×商品匹配</b>的最佳样本。</div>
    <div class="scrollbox"><table id="detTable"><thead><tr><th>客户</th><th>人群</th><th>组</th><th>消耗</th><th>CTR</th><th>CPC</th><th>下单转化率</th><th>下单ROI</th><th>客单价</th><th>ROI vs<br>该客户未命中</th></tr></thead><tbody id="detBody"></tbody></table></div>
    <div class="note">「vs 该客户未命中」= 该客户×人群的 ROI 相对同客户未命中流量 ROI 的变化；消耗&lt;500元的行数值参考意义有限。所有比率指标为该行加总口径（Σ分子/Σ分母）。</div>
  </section>`;
  div(html);
  function render(cust){
    const rows=D.detail.filter(d=>cust==='ALL'||d.customer===cust)
      .sort((a,b)=>b.cost-a.cost);
    document.getElementById('detBody').innerHTML=rows.map(d=>{
      const small=d.cost<500;
      return '<tr'+(small?' class="gray-row"':'')+'><td>'+esc(d.customer)+'</td><td>'+esc(d.name)+'</td><td>'+catPill(d.cat)+'</td>'+
        barCell(d.cost,maxCost)+'<td>'+fmt(d.ctr)+'</td><td>'+fmt(d.cpc)+'</td><td>'+fmt(d.order_cvr)+'</td><td>'+fmt(d.roi)+'</td><td>'+fmt(d.price,0)+'</td><td>'+liftSpan(d.roi_lift)+'</td></tr>';
    }).join('');
  }
  document.getElementById('custSel').onchange=e=>render(e.target.value);
  render('ALL');

  /* ========== 口径与局限 ========== */
  div(`<section>
    <h2><span class="tag">说明</span>口径、局限与后续建议</h2>
    <ul class="insight">
      <li><b>取数口径：</b>KPI三级行业=厨具、原视图40个advertiser_id（与看板筛选一致，本期总消耗 103.96 万、9家客户）；分人群出价leveltag为广告日志上报口径（target_cpa_source_level_tag），未上报的流量计入"未命中"。</li>
      <li><b>指标算法：</b>CTR=Σ点击/Σ曝光；CPC=Σ消耗/Σ点击；下单转化率=Σ下单次数/Σ点击；ROI=Σ下单金额/Σ消耗；客单价=Σ下单金额/Σ下单次数——全部为加总口径，非算术平均。</li>
      <li><b>结论边界：</b>① 本报告为 11.16-11.23 同期横截面证据（按要求不含时间维度对比），命中与未命中的差异同时包含人群与投放商品/广告结构两个因素，不能100%归因于人群；② 命中消耗占 9.8%、多个人群单包消耗不足千元，单人群结论受小样本影响；③ 效率指标的改善方向在8家客户中一致性较好，可信度高于单人群结论。</li>
      <li><b>后续建议：</b>P0——把高频食材人群（蛋类/蔬菜干/蟹类/调味料/鸡肉）绑定<b>中高客单价商品</b>测试，验证客单价缺口可否收敛；P0——对创大厨具（点击强转化弱）做人群×商品匹配诊断；P1——厨房工具/山药/鱼类三类低效人群降出价或停用；P1——观察2~4周，命中消耗占比若能放大至15%+，再评估对整体ROI的实际影响。</li>
    </ul>
  </section>`);
})();
</script>
